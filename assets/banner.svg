<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420" style="background: #090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <style>
      .orb-1 {
        animation: floatOrb 9s ease-in-out infinite alternate;
      }
      .orb-2 {
        animation: floatOrb2 11s ease-in-out infinite alternate;
      }
      .flow-line {
        stroke-dasharray: 8 8;
        animation: dashMove 20s linear infinite;
      }
      .bar-pulse {
        animation: barBounce 3.5s ease-in-out infinite alternate;
      }
      .bar-pulse-2 {
        animation: barBounce 4.2s ease-in-out 0.8s infinite alternate;
      }
      .bar-pulse-3 {
        animation: barBounce 3s ease-in-out 1.5s infinite alternate;
      }
      .pulse-circle {
        animation: pulseScale 2.8s ease-in-out infinite;
      }
      .pill-hover {
        transition: transform 0.3s ease;
      }
      @keyframes dashMove {
        to {
          stroke-dashoffset: -1000;
        }
      }
      @keyframes floatOrb {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(45px, -30px) scale(1.15); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-35px, 35px) scale(1.1); }
      }
      @keyframes barBounce {
        0% { height: 35px; y: 335px; }
        50% { height: 65px; y: 305px; }
        100% { height: 45px; y: 325px; }
      }
      @keyframes pulseScale {
        0% { r: 4px; opacity: 0.6; }
        50% { r: 9px; opacity: 1; }
        100% { r: 4px; opacity: 0.6; }
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="420" fill="url(#bg-grad)" />

  <!-- Animated Glowing Ambience in Background -->
  <g opacity="0.35">
    <circle class="orb-1" cx="220" cy="110" r="140" fill="#38bdf8" filter="url(#glow)" />
    <circle class="orb-2" cx="980" cy="290" r="170" fill="#a855f7" filter="url(#glow)" />
    <circle class="orb-1" cx="800" cy="90" r="110" fill="#6366f1" filter="url(#glow)" />
  </g>

  <!-- Cyber Grid -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Decorative Wave / Dynamic Data Streams in Lower Canvas -->
  <g opacity="0.55">
    <path class="flow-line" d="M -50 360 C 250 310, 400 390, 650 340 C 900 290, 1050 370, 1250 330" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path class="flow-line" d="M -50 380 C 200 420, 500 330, 750 380 C 1000 430, 1150 340, 1250 370" fill="none" stroke="#c084fc" stroke-width="2" />
  </g>

  <!-- Ambient Micro Data Bars in Background Bottom -->
  <g opacity="0.25">
    <rect x="70" class="bar-pulse" y="320" width="10" height="50" rx="3" fill="#38bdf8" />
    <rect x="90" class="bar-pulse-2" y="300" width="10" height="70" rx="3" fill="#818cf8" />
    <rect x="110" class="bar-pulse-3" y="330" width="10" height="40" rx="3" fill="#c084fc" />
    <rect x="1080" class="bar-pulse-3" y="310" width="10" height="60" rx="3" fill="#38bdf8" />
    <rect x="1100" class="bar-pulse" y="290" width="10" height="80" rx="3" fill="#818cf8" />
    <rect x="1120" class="bar-pulse-2" y="325" width="10" height="45" rx="3" fill="#c084fc" />
  </g>

  <!-- FOREGROUND CONTAINER: Glassmorphism Backplate to guarantee 100% readability -->
  <rect x="70" y="45" width="1060" height="290" rx="20" fill="#0b1324" fill-opacity="0.82" stroke="#334155" stroke-opacity="0.7" stroke-width="1.2" />

  <!-- Corner Status Badges -->
  <g transform="translate(100, 72)">
    <rect width="182" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <circle class="pulse-circle" cx="16" cy="14" r="5" fill="#10b981" />
    <text x="32" y="18" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">CURATED AWESOME LIST</text>
  </g>

  <g transform="translate(870, 72)">
    <rect width="230" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5" />
    <text x="18" y="18" fill="#94a3b8" font-size="12" font-weight="500">API Streams • BI • Dashboards</text>
  </g>

  <!-- MAIN TITLE & BRANDING (High Contrast, Bold Foreground) -->
  <g transform="translate(100, 160)">
    <text x="0" y="0" font-size="44" font-weight="900" letter-spacing="-1.2">
      <tspan fill="#ffffff">Awesome </tspan>
      <tspan fill="url(#primary-grad)">API Data &amp; Response</tspan>
    </text>
    <text x="0" y="50" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1.2">
      Visualization
    </text>
  </g>

  <!-- SUBTITLE (Foreground, Pristine Readability) -->
  <text x="100" y="250" font-size="16.5" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    The ultimate index of modern open-source engines, enterprise BI platforms, and developer client visualizers.
  </text>

  <!-- FEATURE TAG PILLS (Foreground) -->
  <g transform="translate(100, 280)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="125" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />
      <text x="16" y="20" fill="#38bdf8" font-size="12.5" font-weight="700">⚡ JSON to UI</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(138, 0)">
      <rect width="168" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.7" />
      <text x="16" y="20" fill="#a5b4fc" font-size="12.5" font-weight="700">📊 Business Intelligence</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(319, 0)">
      <rect width="170" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.7" />
      <text x="16" y="20" fill="#e879f9" font-size="12.5" font-weight="700">🔍 Observability Feeds</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(502, 0)">
      <rect width="160" height="32" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.7" />
      <text x="16" y="20" fill="#6ee7b7" font-size="12.5" font-weight="700">🔓 Open-Source First</text>
    </g>
  </g>

  <!-- Floating Dynamic Tech Decorative Nodes (Right Foreground) -->
  <g transform="translate(930, 160)" opacity="0.95">
    <rect width="170" height="110" rx="12" fill="#111c33" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.6" filter="url(#soft-glow)" />
    <path d="M 20 80 Q 55 25, 85 55 T 150 30" fill="none" stroke="#38bdf8" stroke-width="3" />
    <circle cx="85" cy="55" r="4" fill="#818cf8" />
    <circle cx="150" cy="30" r="4" fill="#34d399" />
    <text x="20" y="25" fill="#64748b" font-size="10" font-weight="700">API STREAM METRICS</text>
    <text x="20" y="98" fill="#38bdf8" font-size="11" font-weight="600">2.4M req/s • 99.98%</text>
  </g>
</svg>
